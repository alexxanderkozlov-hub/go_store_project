<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Категории товаров - СкладPRO</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: white;
    color: #333;
    line-height: 1.6;
    padding: 30px;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
}

.page-title {
    font-size: 32px;
    color: #000000;
    margin-bottom: 25px;
    font-weight: 700;
}

/* Фильтры */
.filters {
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 1px solid #eee;
}

.filter-row {
    display: flex;
    gap: 20px;
    margin-bottom: 15px;
    align-items: center;
}

.filter-group {
    display: flex;
    align-items: center;
    gap: 10px;
}

.filter-group label {
    font-size: 15px;
    color: #555;
    font-weight: 500;
}

input, select {
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 15px;
    background: white;
    min-width: 180px;
}

.filter-buttons {
    display: flex;
    gap: 12px;
}

.btn {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.3s ease;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

.btn-apply {
    background: #3498db;
    color: white;
}

.btn-reset {
    background: #95a5a6;
    color: white;
}

/* Кнопки действий */
.top-buttons {
    display: flex;
    gap: 15px;
    margin-bottom: 25px;
}

.top-btn {
    background: #3498db;
    color: white;
    padding: 12px 24px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    transition: all 0.3s ease;
}

.top-btn:hover {
    background: #2980b9;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
}

.btn-success {
    background: #27ae60;
}

.btn-success:hover {
    background: #229954;
}

/* Таблица */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    overflow: hidden;
}

th {
    background: #f8fafc;
    color: #2c3e50;
    font-weight: 600;
    text-align: left;
    padding: 16px 20px;
    border-bottom: 2px solid #e0e0e0;
    border-right: 1px solid #e0e0e0;
    cursor: default;
}

td {
    padding: 14px 20px;
    border-bottom: 1px solid #f0f0f0;
    border-right: 1px solid #f0f0f0;
}

td:last-child {
    border-right: none;
}

tr:hover {
    background: #f8fafc;
}

.actions-cell {
    width: 200px;
}

.action-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    margin-right: 8px;
    font-weight: 500;
    transition: all 0.2s ease;
}

.action-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.btn-edit {
    background: #3498db;
    color: white;
}

.btn-delete {
    background: #e74c3c;
    color: white;
}

.back-container {
    margin-top: 30px;
    display: flex;
    justify-content: center;
}

.back-btn {
    background: #3498db;
    color: white;
    padding: 12px 24px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
}

.back-btn:hover {
    background: #2980b9;
    box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
}

tr:last-child td {
    border-bottom: none;
}

.no-data {
    text-align: center;
    padding: 40px;
    color: #7f8c8d;
    font-size: 16px;
}

.category-count {
    background: #f8f9fa;
    padding: 15px;
    border-radius: 6px;
    margin-bottom: 20px;
    font-size: 16px;
    color: #2c3e50;
    border-left: 4px solid #3498db;
}

.category-count strong {
    color: #3498db;
}
</style>
</head>
<body>
<div class="container">
    <h1 class="page-title">Категории товаров</h1>

    <div class="category-count">
        Всего категорий: <strong>{{.total_count}}</strong>
    </div>

    <!-- Фильтры -->
    <div class="filters">
        <div class="filter-row">
            <div class="filter-group">
                <label>Категория:</label>
                <input type="text" id="category-search" placeholder="Введите название" value="{{.search_query}}">
            </div>

            <div class="filter-group">
                <label>Сортировать по:</label>
                <select id="sort">
                    <option value="">Без сортировки</option>
                    <option value="id" {{if eq .sort_by "id"}}selected{{end}}>ID</option>
                    <option value="name" {{if eq .sort_by "name"}}selected{{end}}>Название</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Направление:</label>
                <select id="direction">
                    <option value="asc" {{if eq .direction "asc"}}selected{{end}}>По возрастанию</option>
                    <option value="desc" {{if eq .direction "desc"}}selected{{end}}>По убыванию</option>
                </select>
            </div>
        </div>

        <div class="filter-buttons">
            <button class="btn btn-apply" id="applyBtn">Применить</button>
            <button class="btn btn-reset" id="resetBtn">Сбросить</button>
        </div>
    </div>

    <!-- Кнопки действий -->
    <div class="top-buttons">
        <button class="top-btn" onclick="window.location.href='/categories/create'">
            <span style="font-size: 18px;">+</span> Добавить категорию
        </button>
        <a href="/export/txt?type=categories" class="top-btn">
            <span class="download-icon">📄</span> Скачать TXT
        </a>
        <a href="/export/csv?type=categories" class="top-btn btn-success">
            <span class="download-icon">📊</span> Скачать XLSX
        </a>
    </div>

    <!-- Таблица -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Описание</th>
                <th class="actions-cell">Действия</th>
            </tr>
        </thead>
        <tbody>
            {{range .categories}}
            <tr>
                <td>{{.ID}}</td>
                <td>{{.Name}}</td>
                <td>{{.Description}}</td>
                <td class="actions-cell">
                    <button class="action-btn btn-edit" onclick="window.location.href='/categories/{{.ID}}/edit'">Редактировать</button>
                    <button class="action-btn btn-delete" onclick="if(confirm('Удалить категорию?')) window.location.href='/categories/{{.ID}}/delete'">Удалить</button>
                </td>
            </tr>
            {{else}}
            <tr><td colspan="4" class="no-data">Категории отсутствуют</td></tr>
            {{end}}
        </tbody>
    </table>

    <div class="back-container">
        <a href="/main" class="back-btn">
            <span>←</span> Назад в навигатор
        </a>
    </div>
</div>

<script>
(function() {
    const tbody = document.querySelector('table tbody');
    const rowsInitial = Array.from(tbody.querySelectorAll('tr')).filter(r => !r.querySelector('.no-data'));
    const searchInput = document.getElementById('category-search');
    const sortSelect = document.getElementById('sort');
    const directionSelect = document.getElementById('direction');
    const totalCountEl = document.querySelector('.category-count strong');

    let rowsData = [];

    function readRows() {
        rowsData = rowsInitial.map(row => {
            return {
                rowEl: row,
                id: Number(row.children[0].textContent.trim()),
                name: row.children[1].textContent.trim().toLowerCase()
            };
        });
        updateTotalCount(rowsData.length);
    }

    function updateTotalCount(count) {
        totalCountEl.textContent = count;
    }

    function renderRows(list) {
        tbody.innerHTML = '';
        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="4" class="no-data">Категории не найдены</td></tr>';
            updateTotalCount(0);
            return;
        }
        list.forEach(item => tbody.appendChild(item.rowEl));
        updateTotalCount(list.length);
    }

    function applyFilters() {
        const search = searchInput.value.trim().toLowerCase();
        const sortKey = sortSelect.value;
        const direction = directionSelect.value;

        let filtered = rowsData.filter(item => {
            return !search || item.name.includes(search);
        });

        if (sortKey) {
            const dir = direction === 'desc' ? -1 : 1;
            filtered.sort((a,b) => {
                if (sortKey === 'id') return (a.id - b.id) * dir;
                if (sortKey === 'name') return (a.name < b.name ? -1 : a.name > b.name ? 1 : 0) * dir;
                return 0;
            });
        }

        renderRows(filtered);
    }

    function resetFilters() {
        searchInput.value = '';
        sortSelect.value = '';
        directionSelect.value = 'asc';
        renderRows(rowsData.slice());
    }

    readRows();

    document.getElementById('applyBtn').addEventListener('click', applyFilters);
    document.getElementById('resetBtn').addEventListener('click', resetFilters);
    searchInput.addEventListener('keypress', e => { if (e.key === 'Enter') applyFilters(); });
})();
</script>
</body>
</html>
