<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная - Система учёта товаров</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.5;
            transition: background-color 0.3s, color 0.3s;
        }
        
        .container {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 260px;
            background-color: white;
            padding: 25px 0;
            box-shadow: 1px 0 5px rgba(0,0,0,0.1);
            transition: background-color 0.3s, color 0.3s;
        }
        
        .sidebar-header {
            padding: 0 25px 25px 25px;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }
        
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
            transition: color 0.3s;
        }
        
        .system-name {
            font-size: 14px;
            color: #666;
            transition: color 0.3s;
        }
        
        .sidebar-section {
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 13px;
            color: #000000;
            text-transform: uppercase;
            padding: 0 25px 10px 25px;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            font-weight: bold;
            transition: color 0.3s, border-color 0.3s;
        }
        
        .nav-list {
            list-style: none;
        }
        
        .nav-item {
            margin-bottom: 5px;
        }
        
        .nav-link {
            display: block;
            padding: 10px 25px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
            transition: background-color 0.2s, color 0.3s;
        }
        
        .nav-link:hover {
            background-color: #f0f7ff;
            color: #0066cc;
        }
        
        .nav-link.active {
            background-color: #e6f2ff;
            color: #0066cc;
            font-weight: bold;
            border-left: 3px solid #0066cc;
        }
        
        .main-content {
            flex: 1;
            padding: 30px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .page-title {
            font-size: 28px;
            color: #2c3e50;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .header-controls {
            display: flex;
            gap: 10px;
        }
        
        .theme-toggle {
            padding: 8px 16px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .theme-toggle:hover {
            background: #f5f5f5;
        }
        
        .logout-btn {
            padding: 8px 16px;
            background: #fff5f5;
            border: 1px solid #ffcccc;
            color: #cc0000;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .logout-btn:hover {
            background: #ffe6e6;
        }
        
        .dashboard {
            background: white;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: background-color 0.3s, color 0.3s;
            text-align: center;
        }
        
        .welcome-title {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 40px;
            transition: color 0.3s;
        }
        
        .main-buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        
        .main-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 30px;
            width: 200px;
            text-align: center;
            text-decoration: none;
            color: #333;
            transition: all 0.3s;
        }
        
        .main-btn:hover {
            border-color: #0066cc;
        }
        
        .btn-icon {
            font-size: 48px;
            margin-bottom: 20px;
            display: block;
        }
        
        .btn-label {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            transition: color 0.3s;
        }
        
        /* Стили для тёмной темы */
        body.dark-mode {
            background-color: #121212;
            color: #ffffff;
        }
        
        body.dark-mode .sidebar {
            background-color: #1e1e1e;
            border-right-color: #333;
        }
        
        body.dark-mode .sidebar-header {
            border-bottom-color: #333;
        }
        
        /* ВСЕ заголовки становятся БЕЛЫМИ в тёмной теме */
        body.dark-mode .logo,
        body.dark-mode .page-title,
        body.dark-mode .welcome-title,
        body.dark-mode .btn-label,
        body.dark-mode .section-title,
        body.dark-mode .nav-link {
            color: #ffffff !important;
        }
        
        body.dark-mode .system-name {
            color: #b0b0b0;
        }
        
        body.dark-mode .section-title {
            border-bottom-color: #444;
        }
        
        body.dark-mode .nav-link:hover {
            background-color: #2a2a2a;
            color: #ffffff !important;
        }
        
        body.dark-mode .nav-link.active {
            background-color: #2a2a2a;
            color: #ffffff !important;
            border-left-color: #ffffff;
        }
        
        body.dark-mode .dashboard,
        body.dark-mode .main-btn {
            background-color: #1e1e1e;
            border-color: #444;
            color: #ffffff;
        }
        
        body.dark-mode .main-btn:hover {
            border-color: #666;
        }
        
        body.dark-mode .theme-toggle {
            background-color: #2a2a2a;
            color: #ffffff;
            border-color: #444;
        }
        
        body.dark-mode .theme-toggle:hover {
            background-color: #333;
        }
        
        body.dark-mode .logout-btn {
            background-color: #2a2a2a;
            color: #ffffff;
            border-color: #444;
        }
        
        body.dark-mode .logout-btn:hover {
            background-color: #333;
        }
        
        /* Иконки в кнопках становятся белыми */
        body.dark-mode .btn-icon {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Боковая панель -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">СкладPRO</div>
                <div class="system-name">Система учёта товаров</div>
            </div>
            
            <div class="sidebar-section">
                <div class="section-title">НАВИГАТОР</div>
                <ul class="nav-list">
                    <li class="nav-item"><a href="/main" class="nav-link active">Главная</a></li>
                    <li class="nav-item"><a href="/about" class="nav-link">О проекте</a></li>
                    <li class="nav-item"><a href="/contacts" class="nav-link">Контакты</a></li>
                </ul>
            </div>
            
            <div class="sidebar-section">
                <div class="section-title">УПРАВЛЕНИЕ</div>
                <ul class="nav-list">
                    <li class="nav-item"><a href="/stores" class="nav-link">Магазины</a></li>
                    <li class="nav-item"><a href="/suppliers" class="nav-link">Поставщики</a></li>
                    <li class="nav-item"><a href="/categories" class="nav-link">Категории товаров</a></li>
                    <li class="nav-item"><a href="/products" class="nav-link">Товары</a></li>
                    <!-- ИСПРАВЛЕНО: должно быть /supplies вместо /deliveries -->
                    <li class="nav-item"><a href="/supplies" class="nav-link">Поставки</a></li>
                </ul>
            </div>
        </div>
        
        <!-- Основное содержимое -->
        <div class="main-content">
            <!-- Верхняя панель -->
            <div class="header">
                <h1 class="page-title">Главное меню</h1>
                <div class="header-controls">
                    <button class="theme-toggle">Тёмная тема</button>
                    <a href="/logout" class="logout-btn">Выйти</a>
                </div>
            </div>
            
            <!-- Основной контент -->
            <div class="dashboard">
                <h2 class="welcome-title">Добро пожаловать в систему учёта товаров</h2>
                
                <div class="main-buttons">
                    <a href="/stores" class="main-btn">
                        <span class="btn-icon">🏪</span>
                        <span class="btn-label">Магазины</span>
                    </a>
                    
                    <a href="/suppliers" class="main-btn">
                        <span class="btn-icon">🚚</span>
                        <span class="btn-label">Поставщики</span>
                    </a>
                    
                    <a href="/products" class="main-btn">
                        <span class="btn-icon">📦</span>
                        <span class="btn-label">Товары</span>
                    </a>
                    
                    <!-- ДОБАВЛЕНА КНОПКА ДЛЯ ПОСТАВОК -->
                    <a href="/supplies" class="main-btn">
                        <span class="btn-icon">📋</span>
                        <span class="btn-label">Поставки</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Переключатель темы
        const themeToggle = document.querySelector('.theme-toggle');
        
        themeToggle.addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            this.textContent = isDark ? 'Светлая тема' : 'Тёмная тема';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
        
        // Загрузка сохраненной темы
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeToggle.textContent = 'Светлая тема';
            }
        });
    </script>
</body>
</html>
