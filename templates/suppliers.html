<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поставщики - СкладPRO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: white;
            color: #333;
            line-height: 1.6;
            padding: 30px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .page-title {
            font-size: 32px;
            color: #000000;
            margin-bottom: 25px;
            font-weight: 700;
        }
        
        /* Фильтры */
        .filters {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        
        .filter-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .filter-group label {
            font-size: 15px;
            color: #555;
            font-weight: 500;
        }
        
        input, select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            background: white;
            min-width: 180px;
        }
        
        .filter-buttons {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .btn-apply {
            background: #3498db;
            color: white;
        }
        
        .btn-apply:hover {
            background: #2980b9;
        }
        
        .btn-reset {
            background: #95a5a6;
            color: white;
        }
        
        .btn-reset:hover {
            background: #7f8c8d;
        }
        
        /* Кнопки действий */
        .top-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .top-btn {
            background: #3498db;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        
        .top-btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }
        
        .btn-success {
            background: #27ae60;
        }
        
        .btn-success:hover {
            background: #229954;
        }
        
        /* Таблица с вертикальными линиями */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }
        
        th {
            background: #f8fafc;
            color: #2c3e50;
            font-weight: 600;
            text-align: left;
            padding: 16px 20px;
            border-bottom: 2px solid #e0e0e0;
            border-right: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        th:hover {
            background: #e8f4fc;
        }
        
        th.sort-asc::after {
            content: " ▲";
            font-size: 12px;
        }
        
        th.sort-desc::after {
            content: " ▼";
            font-size: 12px;
        }
        
        th:last-child {
            border-right: none;
        }
        
        td {
            padding: 14px 20px;
            border-bottom: 1px solid #f0f0f0;
            border-right: 1px solid #f0f0f0;
        }
        
        td:last-child {
            border-right: none;
        }
        
        tr:hover {
            background: #f8fafc;
        }
        
        .actions-cell {
            width: 200px;
        }
        
        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            margin-right: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        
        .btn-edit {
            background: #3498db;
            color: white;
        }
        
        .btn-edit:hover {
            background: #2980b9;
        }
        
        .btn-delete {
            background: #e74c3c;
            color: white;
        }
        
        .btn-delete:hover {
            background: #c0392b;
        }
        
        /* Назад - исправленная кнопка */
        .back-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }
        
        .back-btn {
            background: #3498db;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background: #2980b9;
            transform: none;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }
        
        /* Последняя строка без нижней границы */
        tr:last-child td {
            border-bottom: none;
        }
        
        /* Сообщение "нет данных" */
        .no-data {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
            font-size: 16px;
        }
        
        /* Иконки для кнопок скачивания */
        .download-icon {
            font-size: 16px;
        }
        
        /* Счетчик поставщиков */
        .supplier-count {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 16px;
            color: #2c3e50;
            border-left: 4px solid #3498db;
        }
        
        .supplier-count strong {
            color: #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">Список поставщиков</h1>
        
        <!-- Счетчик поставщиков -->
        <div class="supplier-count">
            Всего поставщиков: <strong>{{.total_count}}</strong>
        </div>
        
        <!-- Фильтры -->
        <div class="filters">
            <div class="filter-row">
                <div class="filter-group">
                    <label>Поставщик:</label>
                    <input type="text" id="supplier-search" placeholder="Введите название" value="{{.search_query}}">
                </div>
                
                <div class="filter-group">
                    <label>Сортировать по:</label>
                    <select id="sort">
                        <option value="">Без сортировки</option>
                        <option value="id" {{if eq .sort_by "id"}}selected{{end}}>ID</option>
                        <option value="name" {{if eq .sort_by "name"}}selected{{end}}>Названию</option>
                        <option value="phone" {{if eq .sort_by "phone"}}selected{{end}}>Телефону</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>Направление:</label>
                    <select id="direction">
                        <option value="asc" {{if eq .direction "asc"}}selected{{end}}>По возрастанию</option>
                        <option value="desc" {{if eq .direction "desc"}}selected{{end}}>По убыванию</option>
                    </select>
                </div>
            </div>
            
            <div class="filter-buttons">
                <button class="btn btn-apply" id="applyBtn">Применить</button>
                <button class="btn btn-reset" id="resetBtn">Сбросить</button>
            </div>
        </div>
        
        <!-- Кнопки действий -->
        <div class="top-buttons">
            <button class="top-btn" onclick="window.location.href='/suppliers/create'">
                <span style="font-size: 18px;">+</span> Добавить поставщика
            </button>
            <a href="/export/txt?type=suppliers" class="top-btn">
                <span class="download-icon">📄</span> Скачать TXT
            </a>
            <a href="/export/csv?type=suppliers" class="top-btn btn-success">
                <span class="download-icon">📊</span> Скачать XLSX
            </a>
        </div>
        
        <!-- Таблица -->
        <table>
            <thead>
                <tr>
                    <th onclick="sortTable('id')" class="{{if eq .sort_by "id"}}{{if eq .direction "asc"}}sort-asc{{else}}sort-desc{{end}}{{end}}">ID</th>
                    <th onclick="sortTable('name')" class="{{if eq .sort_by "name"}}{{if eq .direction "asc"}}sort-asc{{else}}sort-desc{{end}}{{end}}">Компания</th>
                    <th onclick="sortTable('phone')" class="{{if eq .sort_by "phone"}}{{if eq .direction "asc"}}sort-asc{{else}}sort-desc{{end}}{{end}}">Телефон</th>
                    <th>Email</th>
                    <th>Адрес</th>
                    <th class="actions-cell">Действия</th>
                </tr>
            </thead>
            <tbody>
                {{range .suppliers}}
                <tr>
                    <td>{{.ID}}</td>
                    <td>{{.Name}}</td>
                    <td>{{.Phone}}</td>
                    <td>{{.Email}}</td>
                    <td>{{.Address}}</td>
                    <td class="actions-cell">
                        <button class="action-btn btn-edit" onclick="window.location.href='/suppliers/{{.ID}}/edit'">Редактировать</button>
                        <button class="action-btn btn-delete" onclick="if(confirm('Удалить поставщика?')) window.location.href='/suppliers/{{.ID}}/delete'">Удалить</button>
                    </td>
                </tr>
                {{else}}
                <tr>

                </tr>
                {{end}}
            </tbody>
        </table>
        
        <!-- Исправленная кнопка "Назад" -->
        <div class="back-container">
            <a href="/main" class="back-btn">
                <span>←</span> Назад в навигатор
            </a>
        </div>
    </div>

    <script>
        // Применение фильтров
        document.getElementById('applyBtn').addEventListener('click', function() {
            applyFilters();
        });
        
        // Сброс фильтров
        document.getElementById('resetBtn').addEventListener('click', function() {
            window.location.href = '/suppliers';
        });
        
        // Поиск при нажатии Enter
        document.getElementById('supplier-search').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                applyFilters();
            }
        });
        
        // Функция применения фильтр
        function applyFilters() {
            const search = document.getElementById('supplier-search').value;
            const sort = document.getElementById('sort').value;
            const direction = document.getElementById('direction').value;
            
            let url = '/suppliers?';
            if (search) url += `search=${encodeURIComponent(search)}&`;
            if (sort) url += `sort=${sort}&`;
            if (direction) url += `direction=${direction}`;
            
            // Убираем последний & если есть
            if (url.endsWith('&')) {
                url = url.slice(0, -1);
            }
            
            window.location.href = url;
        }
        
        // Сортировка по клику на заголовок
        function sortTable(sortBy) {
            const search = document.getElementById('supplier-search').value;
            const currentSort = document.getElementById('sort').value;
            const currentDirection = document.getElementById('direction').value;
            
            let newDirection = 'asc';
            if (currentSort === sortBy) {
                newDirection = currentDirection === 'asc' ? 'desc' : 'asc';
            }
            
            let url = `/suppliers?sort=${sortBy}&direction=${newDirection}`;
            if (search) {
                url += `&search=${encodeURIComponent(search)}`;
            }
            
            window.location.href = url;
        }
        
        // Добавляем обработчик для загрузки файлов
        document.querySelectorAll('.top-btn[href*="/export/"]').forEach(btn => {
            btn.addEventListener('click', function(e) {
                // Показываем сообщение о начале загрузки
                const originalText = this.innerHTML;
                this.innerHTML = '<span class="download-icon">⏳</span> Подготовка файла...';
                this.style.opacity = '0.8';
                this.style.cursor = 'wait';
                
                // Через 2 секунды возвращаем оригинальный текст
                setTimeout(() => {
                    this.innerHTML = originalText;
                    this.style.opacity = '1';
                    this.style.cursor = 'pointer';
                }, 2000);
            });
        });
    </script>
</body>
</html>
