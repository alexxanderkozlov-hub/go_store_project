<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поставщики - СкладPRO</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background:white; color:#333; line-height:1.6; padding:30px; }
    .container { max-width:1200px; margin:0 auto; }
    .page-title { font-size:32px; color:#000; margin-bottom:25px; font-weight:700; }

    .filters { margin-bottom:25px; padding-bottom:20px; border-bottom:1px solid #eee; }
    .filter-row { display:flex; gap:20px; margin-bottom:15px; align-items:center; flex-wrap:wrap; }
    .filter-group { display:flex; align-items:center; gap:10px; }
    .filter-group label { font-size:15px; color:#555; font-weight:500; }
    input, select { padding:8px 12px; border:1px solid #ddd; border-radius:6px; font-size:15px; min-width:180px; }
    .filter-buttons { display:flex; gap:12px; }
    .btn { padding:10px 20px; border:none; border-radius:6px; font-size:15px; cursor:pointer; font-weight:500; transition:all 0.2s ease; }
    .btn-apply { background:#3498db; color:#fff; }
    .btn-reset { background:#95a5a6; color:#fff; }

    .top-buttons { display:flex; gap:15px; margin-bottom:25px; flex-wrap:wrap; }
    .top-btn { background:#3498db; color:white; padding:12px 24px; border:none; border-radius:6px; cursor:pointer; font-size:15px; font-weight:500; display:flex; align-items:center; gap:8px; text-decoration:none; }
    .btn-success { background:#27ae60; }
    .top-btn:hover { background:#2980b9; }
    .btn-success:hover { background:#229954; }

    table { width:100%; border-collapse:collapse; margin-top:10px; border:1px solid #e0e0e0; border-radius:8px; overflow:hidden; }
    th, td { padding:14px 20px; border-bottom:1px solid #f0f0f0; border-right:1px solid #f0f0f0; text-align:left; vertical-align:middle; }
    th:last-child, td:last-child { border-right:none; }
    tr:hover { background:#f8fafc; }

    .actions-cell { width:200px; }
    .action-btn { padding:8px 16px; border:none; border-radius:4px; font-size:14px; cursor:pointer; margin-right:8px; font-weight:500; }
    .btn-edit { background:#3498db; color:white; }
    .btn-delete { background:#e74c3c; color:white; }

    .supplier-count { background:#f8f9fa; padding:15px; border-radius:6px; margin-bottom:20px; font-size:16px; color:#2c3e50; border-left:4px solid #3498db; }
    .supplier-count strong { color:#3498db; }

    .back-container { margin-top:30px; display:flex; justify-content:center; }
    .back-btn { background:#3498db; color:white; padding:12px 24px; border-radius:6px; text-decoration:none; display:flex; align-items:center; gap:8px; font-weight:500; }
    .back-btn:hover { background:#2980b9; }
    .no-data { text-align:center; padding:40px; color:#7f8c8d; font-size:16px; }
</style>
</head>
<body>
<div class="container">
    <h1 class="page-title">Список поставщиков</h1>

    <div class="supplier-count">
        Всего поставщиков: <strong id="total-count">{{.total_count}}</strong>
    </div>

    <div class="filters">
        <div class="filter-row">
            <div class="filter-group">
                <label>Поставщик:</label>
                <input type="text" id="supplier-search" placeholder="Введите название" value="{{.search_query}}">
            </div>
            <div class="filter-group">
                <label>Сортировать по:</label>
                <select id="sort">
                    <option value="">Без сортировки</option>
                    <option value="id" {{if eq .sort_by "id"}}selected{{end}}>ID</option>
                    <option value="name" {{if eq .sort_by "name"}}selected{{end}}>Названию</option>
                    <option value="phone" {{if eq .sort_by "phone"}}selected{{end}}>Телефону</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Направление:</label>
                <select id="direction">
                    <option value="asc" {{if eq .direction "asc"}}selected{{end}}>По возрастанию</option>
                    <option value="desc" {{if eq .direction "desc"}}selected{{end}}>По убыванию</option>
                </select>
            </div>
        </div>
        <div class="filter-buttons">
            <button class="btn btn-apply" id="applyBtn">Применить</button>
            <button class="btn btn-reset" id="resetBtn">Сбросить</button>
        </div>
    </div>

    <div class="top-buttons">
        <button class="top-btn" onclick="window.location.href='/suppliers/create'">
            <span style="font-size:18px;">+</span> Добавить поставщика
        </button>
        <a href="/export/txt?type=suppliers" class="top-btn">Скачать TXT</a>
        <a href="/export/csv?type=suppliers" class="top-btn btn-success">Скачать XLSX</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Компания</th>
                <th>Телефон</th>
                <th>Email</th>
                <th>Адрес</th>
                <th class="actions-cell">Действия</th>
            </tr>
        </thead>
        <tbody id="suppliersBody">
            {{range .suppliers}}
            <tr>
                <td class="col-id">{{.ID}}</td>
                <td class="col-name">{{.Name}}</td>
                <td class="col-phone">{{.Phone}}</td>
                <td>{{.Email}}</td>
                <td>{{.Address}}</td>
                <td class="actions-cell">
                    <button class="action-btn btn-edit" onclick="window.location.href='/suppliers/{{.ID}}/edit'">Редактировать</button>
                    <button class="action-btn btn-delete" onclick="if(confirm('Удалить поставщика?')) window.location.href='/suppliers/{{.ID}}/delete'">Удалить</button>
                </td>
            </tr>
            {{else}}
            <tr><td colspan="6" class="no-data">Поставщики отсутствуют</td></tr>
            {{end}}
        </tbody>
    </table>

    <div class="back-container">
        <a href="/main" class="back-btn"><span>←</span> Назад в навигатор</a>
    </div>
</div>

<script>
(function() {
    const tbody = document.getElementById('suppliersBody');
    const rowsInitial = Array.from(tbody.querySelectorAll('tr')).filter(r => !r.querySelector('.no-data'));
    let rowsData = [];
    const totalCountEl = document.getElementById('total-count');

    function readRows() {
        rowsData = rowsInitial.map(row => {
            const id = Number(row.querySelector('.col-id')?.textContent.trim() || 0);
            const name = row.querySelector('.col-name')?.textContent.trim() || '';
            const phone = row.querySelector('.col-phone')?.textContent.trim() || '';
            return { rowEl: row, id, name, phone };
        });
        updateTotalCount();
    }

    function updateTotalCount(count) {
        totalCountEl.textContent = count ?? rowsData.length;
    }

    function clearBody() { tbody.innerHTML = ''; }

    function renderRows(list) {
        clearBody();
        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="no-data">Поставщики не найдены</td></tr>';
            updateTotalCount(0);
            return;
        }
        const frag = document.createDocumentFragment();
        list.forEach(item => frag.appendChild(item.rowEl));
        tbody.appendChild(frag);
        updateTotalCount(list.length);
    }

    function sortList(list, key, dir) {
        const direction = dir === 'desc' ? -1 : 1;
        return list.slice().sort((a,b) => {
            if (key === 'name') return (a.name.toLowerCase() < b.name.toLowerCase() ? -1 : a.name.toLowerCase() > b.name.toLowerCase() ? 1 : 0) * direction;
            if (key === 'phone') return (a.phone < b.phone ? -1 : a.phone > b.phone ? 1 : 0) * direction;
            if (key === 'id') return (a.id - b.id) * direction;
            return 0;
        });
    }

    function applyFilters() {
        const search = (document.getElementById('supplier-search').value || '').trim().toLowerCase();
        const sortKey = document.getElementById('sort').value || '';
        const direction = document.getElementById('direction').value || 'asc';

        let filtered = rowsData.filter(item => {
            return !search || item.name.toLowerCase().includes(search) || item.phone.toLowerCase().includes(search) || String(item.id).includes(search);
        });

        if (sortKey) filtered = sortList(filtered, sortKey, direction);
        renderRows(filtered);
    }

    function resetFilters() {
        document.getElementById('supplier-search').value = '';
        document.getElementById('sort').value = '';
        document.getElementById('direction').value = 'asc';
        renderRows(rowsData.slice());
    }

    readRows();

    document.getElementById('applyBtn').addEventListener('click', applyFilters);
    document.getElementById('resetBtn').addEventListener('click', resetFilters);
})();
</script>
</body>
</html>
