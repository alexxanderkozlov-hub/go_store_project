<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}} - Товары</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .form-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .form-header {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 25px 30px;
        }
        
        .form-header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        
        .form-body {
            padding: 30px;
        }
        
        .error-message {
            background: #ffe6e6;
            color: #d32f2f;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 4px solid #d32f2f;
            font-size: 15px;
        }
        
        .success-message {
            background: #e8f5e8;
            color: #27ae60;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 4px solid #27ae60;
            font-size: 15px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        
        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            background: #fafafa;
        }
        
        .form-group input[type="text"]:focus,
        .form-group input[type="number"]:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
            background: white;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .required::after {
            content: " *";
            color: #e74c3c;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        
        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }
        
        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            flex: 1;
        }
        
        .btn-submit:hover {
            background: linear-gradient(135deg, #2980b9, #2573a7);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(52, 152, 219, 0.3);
        }
        
        .btn-cancel {
            background: #95a5a6;
            color: white;
            flex: 1;
        }
        
        .btn-cancel:hover {
            background: #7f8c8d;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(149, 165, 166, 0.3);
        }
        
        .btn-submit:active,
        .btn-cancel:active {
            transform: translateY(0);
        }
        
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #7f8c8d;
            font-size: 14px;
            padding: 10px;
        }
        
        /* Стили для цены */
        .price-input {
            position: relative;
        }
        
        .price-input::after {
            content: "₽";
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-weight: 500;
        }
        
        .price-input input {
            padding-right: 40px !important;
        }
        
        /* Стиль для артикула */
        .sku-hint {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #7f8c8d;
            margin-top: 5px;
        }
        
        /* Стили для кнопки генерации SKU */
        .generate-sku-btn {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.3s;
        }
        
        .generate-sku-btn:hover {
            background: #7f8c8d;
        }
        
        .sku-counter {
            font-size: 13px;
            color: #7f8c8d;
            margin-top: 5px;
            text-align: right;
        }
        
        .char-counter {
            font-size: 13px;
            color: #7f8c8d;
            margin-top: 5px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <div class="form-header">
                <h1>{{.title}}</h1>
            </div>
            
            <div class="form-body">
                {{if .error}}
                <div class="error-message">
                    <strong>Ошибка:</strong> {{.error}}
                </div>
                {{end}}
                
                {{if .success}}
                <div class="success-message">
                    <strong>Успешно!</strong> {{.success}}
                </div>
                {{end}}
                
                <form method="POST" action="{{.action}}">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name" class="required">Название товара</label>
                            <input type="text" 
                                   id="name" 
                                   name="name" 
                                   value="{{.product.Name}}" 
                                   placeholder="Введите название товара"
                                   required
                                   maxlength="100">
                            <div style="font-size: 13px; color: #7f8c8d; margin-top: 5px;">
                                Максимум 100 символов
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="sku">Артикул (SKU)</label>
                            <input type="text" 
                                   id="sku" 
                                   name="sku" 
                                   value="{{.product.SKU}}" 
                                   placeholder="Например: 12345678"
                                   maxlength="50">
                            <div class="sku-hint">
                                Уникальный код товара (8 цифр), можно оставить пустым
                            </div>
                            <!-- Место для кнопки генерации и счетчика -->
                            <div id="sku-controls"></div>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="price" class="required">Цена</label>
                            <div class="price-input">
                                <input type="number" 
                                       id="price" 
                                       name="price" 
                                       value="{{if .product.Price}}{{printf "%.2f" .product.Price}}{{end}}"
                                       placeholder="0.00"
                                       step="0.01"
                                       min="0"
                                       required>
                            </div>
                            <div style="font-size: 13px; color: #7f8c8d; margin-top: 5px;">
                                В рублях
                            </div>
                        </div>
                        
                        {{if .categories}}
                        <div class="form-group">
                            <label for="category_id">Категория</label>
                            <select id="category_id" name="category_id">
                                <option value="">Без категории</option>
                                {{range .categories}}
                                <option value="{{.ID}}" {{if eq .ID $.product.CategoryID}}selected{{end}}>
                                    {{.Name}}
                                </option>
                                {{end}}
                            </select>
                            <div style="font-size: 13px; color: #7f8c8d; margin-top: 5px;">
                                Необязательно
                            </div>
                        </div>
                        {{end}}
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Описание товара</label>
                        <textarea id="description" 
                                  name="description" 
                                  placeholder="Введите описание товара (необязательно)">{{.product.Description}}</textarea>
                        <div style="font-size: 13px; color: #7f8c8d; margin-top: 5px;">
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-submit">
                            <span style="margin-right: 8px;">✓</span> 
                            {{if eq .mode "create"}}Добавить товар{{else}}Сохранить изменения{{end}}
                        </button>
                        <a href="/products" class="btn btn-cancel">
                            <span style="margin-right: 8px;">←</span> Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
        

    </div>

    <script>
        // Ждем полной загрузки DOM
        document.addEventListener('DOMContentLoaded', function() {
            // Автофокус на поле названия
            document.getElementById('name').focus();
            
            // Подсчет символов для описания
            const descriptionField = document.getElementById('description');
            const charCounter = document.createElement('div');
            charCounter.className = 'char-counter';
            charCounter.textContent = '0 / 1000 символов';
            
            // Вставляем счетчик после textarea
            descriptionField.parentNode.insertBefore(charCounter, descriptionField.nextSibling);
            
            function updateCharCounter() {
                const length = descriptionField.value.length;
                charCounter.textContent = `${length} / 1000 символов`;
                if (length > 900) {
                    charCounter.style.color = '#e74c3c';
                } else if (length > 800) {
                    charCounter.style.color = '#f39c12';
                } else {
                    charCounter.style.color = '#7f8c8d';
                }
            }
            
            descriptionField.addEventListener('input', updateCharCounter);
            updateCharCounter(); // Инициализация
            
            // Подсчет символов для артикула и кнопка генерации
            const skuField = document.getElementById('sku');
            const skuControls = document.getElementById('sku-controls');
            
            // Создаем контейнер для кнопки и счетчика
            const skuCounter = document.createElement('div');
            skuCounter.className = 'sku-counter';
            skuCounter.textContent = '0 / 50 символов';
            
            const generateSkuBtn = document.createElement('button');
            generateSkuBtn.type = 'button';
            generateSkuBtn.className = 'generate-sku-btn';
            generateSkuBtn.textContent = 'Сгенерировать 8 цифр';
            
            // Добавляем элементы в контейнер
            skuControls.appendChild(generateSkuBtn);
            skuControls.appendChild(skuCounter);
            
            function updateSkuCounter() {
                const length = skuField.value.length;
                skuCounter.textContent = `${length} / 50 символов`;
                if (length > 40) {
                    skuCounter.style.color = '#e74c3c';
                } else if (length > 30) {
                    skuCounter.style.color = '#f39c12';
                } else {
                    skuCounter.style.color = '#7f8c8d';
                }
            }
            
            // Обработчик генерации SKU - ГЕНЕРИРУЕМ 8 ЦИФР
            generateSkuBtn.addEventListener('click', function() {
                // Генерируем 8 случайных цифр
                let randomDigits = '';
                for (let i = 0; i < 8; i++) {
                    randomDigits += Math.floor(Math.random() * 10); // 0-9
                }
                
                // Заполняем поле SKU
                skuField.value = randomDigits;
                updateSkuCounter();
                
                // Фокус на следующее поле
                document.getElementById('price').focus();
            });
            
            skuField.addEventListener('input', updateSkuCounter);
            updateSkuCounter(); // Инициализация
            
            // Валидация формы
            const form = document.querySelector('form');
            form.addEventListener('submit', function(e) {
                const nameField = document.getElementById('name');
                const priceField = document.getElementById('price');
                const skuField = document.getElementById('sku');
                const nameValue = nameField.value.trim();
                const priceValue = parseFloat(priceField.value);
                const skuValue = skuField.value.trim();
                
                // Валидация названия
                if (!nameValue) {
                    e.preventDefault();
                    alert('Пожалуйста, введите название товара');
                    nameField.focus();
                    return;
                }
                
                if (nameValue.length > 100) {
                    e.preventDefault();
                    alert('Название товара должно быть не более 100 символов');
                    nameField.focus();
                    return;
                }
                
                // Валидация артикула
                if (skuValue.length > 50) {
                    e.preventDefault();
                    alert('Артикул должен быть не более 50 символов');
                    skuField.focus();
                    return;
                }
                
                // Проверяем что SKU состоит только из цифр (если заполнен)
                if (skuValue && !/^\d+$/.test(skuValue)) {
                    e.preventDefault();
                    alert('Артикул должен содержать только цифры');
                    skuField.focus();
                    return;
                }
                
                // Валидация цены
                if (isNaN(priceValue) || priceValue < 0) {
                    e.preventDefault();
                    alert('Пожалуйста, введите корректную цену (положительное число)');
                    priceField.focus();
                    return;
                }
                
                // Валидация описания
                if (descriptionField.value.length > 1000) {
                    e.preventDefault();
                    alert('Описание товара должно быть не более 1000 символов');
                    descriptionField.focus();
                    return;
                }
                
                // Показываем сообщение о сохранении
                const submitBtn = form.querySelector('.btn-submit');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<span style="margin-right: 8px;">⏳</span> Сохраняем...';
                submitBtn.disabled = true;
            });
            
            // Нажатие Ctrl+Enter для сохранения
            descriptionField.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'Enter') {
                    form.dispatchEvent(new Event('submit'));
                }
            });
            
            // Автоматическое форматирование цены
            const priceField = document.getElementById('price');
            if (priceField) {
                priceField.addEventListener('blur', function() {
                    if (this.value) {
                        const value = parseFloat(this.value);
                        if (!isNaN(value)) {
                            this.value = value.toFixed(2);
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
