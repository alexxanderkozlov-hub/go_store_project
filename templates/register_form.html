<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Регистрация в системе</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #6c63ff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .register-box {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 350px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-weight: normal;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: #6c63ff;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            border-left: 4px solid #c62828;
            font-size: 14px;
        }

        .btn-register {
            background-color: #6c63ff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: normal;
        }

        .btn-register:hover {
            background-color: #554fd8;
        }

        .login-link {
            margin-top: 15px;
        }

        .btn-login {
            display: block;
            text-align: center;
            background-color: white;
            color: #6c63ff;
            border: 1px solid #6c63ff;
            padding: 12px;
            font-size: 16px;
            border-radius: 4px;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-login:hover {
            background-color: #f3f2ff;
        }
    </style>
</head>

<body>
    <div class="register-box">
        <h1>Регистрация</h1>

        {{if .error}}
        <div class="error">
            {{.error}}
        </div>
        {{end}}

        <!-- Форма отправляет POST запрос на /register для обработки на бэкенде -->
        <form method="POST" action="/register">
            <div class="form-group">
                <input 
                    type="text"
                    name="username"
                    class="form-input"
                    placeholder="Придумайте логин"
                    required
                >
            </div>

            <div class="form-group">
                <input 
                    type="password"
                    name="password"
                    class="form-input"
                    placeholder="Придумайте пароль"
                    required
                >
            </div>

            <div class="form-group">
                <input 
                    type="password"
                    name="confirm_password"
                    class="form-input"
                    placeholder="Повторите пароль"
                    required
                >
            </div>

            <button type="submit" class="btn-register">
                Создать аккаунт
            </button>
        </form>

        <div class="login-link">
            <a href="/login" class="btn-login">
                Уже есть аккаунт? Войти
            </a>
        </div>
    </div>
</body>
</html>
