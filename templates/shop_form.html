<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Корзина</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
            background: #fff;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            margin-bottom: 20px;
        }

        .top {
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 14px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            text-decoration: none;
            color: white;
            display: inline-block;
            margin-right: 5px;
        }

        .btn-back {
            background: #3498db;
        }

        .btn-buy {
            background: #2ecc71;
        }

        .btn-remove {
            background: #e74c3c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        th {
            background: #f5f5f5;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        /* 🔥 БЛОК ОБЩЕЙ СУММЫ */
        .total-box {
            margin-top: 20px;
            padding: 15px;
            background: #f7f7f7;
            border-radius: 8px;
            font-size: 18px;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>🛒 Корзина</h1>

    <div class="top">
        <a href="/shop" class="btn btn-back">← Назад в магазин</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Цена</th>
            <th>Количество</th>
            <th>Итого</th>
            <th>Действия</th>
        </tr>
        </thead>

        <tbody>
        {{range .cart}}
        <tr>
            <td>{{.ProductID}}</td>
            <td>{{.Name}}</td>
            <td class="price">{{printf "%.2f" .Price}}</td>
            <td>{{.Quantity}}</td>
            <td class="price">{{printf "%.2f" .Total}}</td>

            <td>
                <div class="actions">

                    <button class="btn btn-buy"
                            onclick="buyItem('{{.ProductID}}')">
                        Купить
                    </button>

                    <button class="btn btn-remove"
                            onclick="removeItem('{{.ProductID}}')">
                        Удалить
                    </button>

                </div>
            </td>
        </tr>
        {{end}}
        </tbody>
    </table>

    <!-- 🔥 ОБЩАЯ СУММА -->
    <div class="total-box">
        💰 Общая сумма корзины:
        <span class="price">{{printf "%.2f" .total}}</span> ₽
    </div>

</div>

<script>
function buyItem(id) {
    fetch("/cart/buy/" + id)
        .then(() => location.reload());
}

function removeItem(id) {
    fetch("/cart/delete/" + id)
        .then(() => location.reload());
}
</script>

</body>
</html>
