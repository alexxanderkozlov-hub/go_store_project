<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}} - Категории товаров</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .form-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .form-header {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 25px 30px;
        }
        
        .form-header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        
        .form-body {
            padding: 30px;
        }
        
        .error-message {
            background: #ffe6e6;
            color: #d32f2f;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 4px solid #d32f2f;
            font-size: 15px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        
        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            background: #fafafa;
        }
        
        .form-group input[type="text"]:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
            background: white;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .required::after {
            content: " *";
            color: #e74c3c;
        }
        
        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }
        
        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            flex: 1;
        }
        
        .btn-submit:hover {
            background: linear-gradient(135deg, #2980b9, #2573a7);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(52, 152, 219, 0.3);
        }
        
        .btn-cancel {
            background: #95a5a6;
            color: white;
            flex: 1;
        }
        
        .btn-cancel:hover {
            background: #7f8c8d;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(149, 165, 166, 0.3);
        }
        
        .btn-submit:active,
        .btn-cancel:active {
            transform: translateY(0);
        }
        
        .form-info {
            background: #e8f4fc;
            padding: 15px;
            border-radius: 8px;
            margin-top: 25px;
            font-size: 14px;
            color: #2c3e50;
            border-left: 4px solid #3498db;
        }
        
        .form-info ul {
            margin-left: 20px;
            margin-top: 8px;
        }
        
        .form-info li {
            margin-bottom: 5px;
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 20px auto;
            }
            
            .form-body {
                padding: 20px;
            }
            
            .form-actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <div class="form-header">
                <h1>{{.title}}</h1>
            </div>
            
            <div class="form-body">
                {{if .error}}
                <div class="error-message">
                    <strong>Ошибка:</strong> {{.error}}
                </div>
                {{end}}
                
                <form method="POST" action="{{.action}}">
                    <div class="form-group">
                        <label for="name" class="required">Название категории</label>
                        <input type="text" 
                               id="name" 
                               name="name" 
                               value="{{.category.Name}}" 
                               placeholder="Введите название категории"
                               required
                               maxlength="100">
                        <div style="font-size: 13px; color: #7f8c8d; margin-top: 5px;">
                            Максимум 100 символов
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Описание категории</label>
                        <textarea id="description" 
                                  name="description" 
                                  placeholder="Введите описание категории (необязательно)">{{.category.Description}}</textarea>
                    </div>
                    
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-submit">
                            <span style="margin-right: 8px;">✓</span> Сохранить категорию
                        </button>
                        <a href="/categories" class="btn btn-cancel">
                            <span style="margin-right: 8px;">←</span> Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
        

    </div>

    <script>
        // Автофокус на поле ввода
        document.getElementById('name').focus();
        
        // Подсчет символов для описания
        const descriptionField = document.getElementById('description');
        const charCounter = document.createElement('div');
        charCounter.style.fontSize = '13px';
        charCounter.style.color = '#7f8c8d';
        charCounter.style.marginTop = '5px';
        charCounter.style.textAlign = 'right';
        descriptionField.parentNode.insertBefore(charCounter, descriptionField.nextSibling);
        
        function updateCharCounter() {
            const length = descriptionField.value.length;
            charCounter.textContent = `${length} / 500 символов`;
            if (length > 450) {
                charCounter.style.color = '#e74c3c';
            } else if (length > 400) {
                charCounter.style.color = '#f39c12';
            } else {
                charCounter.style.color = '#7f8c8d';
            }
        }
        
        descriptionField.addEventListener('input', updateCharCounter);
        updateCharCounter(); // Инициализация
        
        // Валидация формы
        const form = document.querySelector('form');
        form.addEventListener('submit', function(e) {
            const nameField = document.getElementById('name');
            const nameValue = nameField.value.trim();
            
            if (!nameValue) {
                e.preventDefault();
                alert('Пожалуйста, введите название категории');
                nameField.focus();
                return;
            }
            
            if (nameValue.length > 100) {
                e.preventDefault();
                alert('Название категории должно быть не более 100 символов');
                nameField.focus();
                return;
            }
            
            if (descriptionField.value.length > 500) {
                e.preventDefault();
                alert('Описание категории должно быть не более 500 символов');
                descriptionField.focus();
                return;
            }
            
            // Показываем сообщение о сохранении
            const submitBtn = form.querySelector('.btn-submit');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span style="margin-right: 8px;">⏳</span> Сохраняем...';
            submitBtn.disabled = true;
            
            // Через 5 секунд возвращаем кнопку в исходное состояние
            setTimeout(() => {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }, 5000);
        });
        
        // Нажатие Ctrl+Enter для сохранения
        descriptionField.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
