<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Магазин - Товары</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
            background: #fff;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            position: relative;
        }

        h1 {
            margin-bottom: 20px;
        }

        /* ===== HEADER (кнопки сверху) ===== */
        .top-header {
            position: relative;
            margin-bottom: 20px;
        }

        .btn {
            padding: 8px 12px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            display: inline-block;
            margin-right: 5px;
        }

        .btn-edit {
            background: #3498db;
        }

        /* 🟡 КНОПКА КОРЗИНЫ */
        .btn-cart {
            background: #f1c40f;
            color: #000;
            font-weight: bold;

            position: absolute;
            right: 0;
            top: 0;

            padding: 12px 18px;
            font-size: 16px;
            border-radius: 10px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .btn-cart:hover {
            background: #f39c12;
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            vertical-align: middle;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        th {
            background: #f5f5f5;
            cursor: pointer;
            font-weight: bold;
        }

        th:hover {
            background: #eee;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        .btn-buy {
            background: #2ecc71;
        }

        .btn-delete {
            background: #e74c3c;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Товары</h1>

    <div class="top-header">
        <a href="/main" class="btn btn-edit">Назад</a>

        <a href="/cart" class="btn btn-cart">
            🛒 Корзина
        </a>
    </div>

    <table id="table">
        <thead>
        <tr>
            <th onclick="sortTable(0)">ID</th>
            <th onclick="sortTable(1)">Название</th>
            <th onclick="sortTable(2)">Цена</th>
            <th>Описание</th>
            <th>Артикул</th>
            <th>Действия</th>
        </tr>
        </thead>

        <tbody>
        {{range .products}}
        <tr>
            <td>{{.ID}}</td>
            <td>{{.Name}}</td>
            <td class="price">{{printf "%.2f" .Price}}</td>
            <td>{{.Description}}</td>
            <td>{{.SKU}}</td>

            <td>
                {{if eq $.role "customer"}}
                    <a class="btn btn-buy" href="/cart/add/{{.ID}}">
                        Купить
                    </a>
                {{end}}

                {{if eq $.role "admin"}}
                    <a class="btn btn-edit" href="/products/{{.ID}}/edit">Редакт</a>
                    <a class="btn btn-delete"
                       href="/products/{{.ID}}/delete"
                       onclick="return confirm('Удалить товар?')">
                        Удалить
                    </a>
                {{end}}
            </td>
        </tr>
        {{end}}
        </tbody>
    </table>

</div>

<script>
function sortTable(n) {
    let table = document.getElementById("table");
    let switching = true;
    let dir = "asc";

    while (switching) {
        switching = false;
        let rows = table.rows;

        for (let i = 1; i < rows.length - 1; i++) {
            let shouldSwitch = false;

            let x = rows[i].getElementsByTagName("TD")[n].innerText;
            let y = rows[i + 1].getElementsByTagName("TD")[n].innerText;

            if (n === 0 || n === 2) {
                x = parseFloat(x);
                y = parseFloat(y);
            }

            if (dir === "asc" ? x > y : x < y) {
                shouldSwitch = true;
                break;
            }
        }

        if (shouldSwitch) {
            rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
            switching = true;
        } else if (dir === "asc") {
            dir = "desc";
            switching = true;
        }
    }
}

function buyProduct(id, name) {
    alert("Вы купили: " + name + " (ID: " + id + ")");
}
</script>

</body>
</html>
