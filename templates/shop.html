<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Магазин - Товары</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background: #fff;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            position: relative;
        }

        h1 {
            margin-bottom: 20px;
        }

        /* ===== HEADER (кнопки сверху) ===== */
        .top-header {
            position: relative;
            margin-bottom: 20px;
        }

        .btn {
            padding: 8px 12px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            display: inline-block;
            margin-right: 5px;
            font-size: 14px;
        }

        .btn-edit {
            background: #3498db;
        }

        /* 🟡 КНОПКА КОРЗИНЫ */
        .btn-cart {
            background: #f1c40f;
            color: #000;
            font-weight: bold;

            position: absolute;
            right: 0;
            top: 0;

            padding: 12px 18px;
            font-size: 16px;
            border-radius: 10px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .btn-cart:hover {
            background: #f39c12;
        }

        /* ===== НОВЫЕ СТИЛИ ДЛЯ ФИЛЬТРОВ ===== */
        .filters {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            margin-bottom: 25px;
            border: 1px solid #e9ecef;
        }

        .filter-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 220px;
        }

        .filter-group label {
            font-weight: bold;
            font-size: 14px;
            color: #495057;
        }

        .filter-group input, 
        .filter-group select {
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            background-color: #fff;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-primary {
            background: #2ecc71;
        }

        .btn-primary:hover {
            background: #27ae60;
        }

        .btn-gray {
            background: #95a5a6;
        }

        .btn-gray:hover {
            background: #7f8c8d;
        }

        .btn-hover-lift {
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            vertical-align: middle;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        th {
            background: #f5f5f5;
            cursor: pointer;
            font-weight: bold;
        }

        th:hover {
            background: #eee;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        .btn-buy {
            background: #2ecc71;
        }
        
        .btn-buy:hover {
            background: #27ae60;
        }

        .btn-delete {
            background: #e74c3c;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Товары</h1>

    <div class="top-header">
        <a href="/main" class="btn btn-edit">Назад</a>

        <a href="/cart" class="btn btn-cart">
            🛒 Корзина
        </a>
    </div>

    <!-- Фильтры -->
    <form method="GET" action="/shop" class="filters">
        <div class="filter-row">
            <div class="filter-group">
                <label for="search">Поиск товара:</label>
                <input type="text" id="search" name="search_query" placeholder="Название, артикул или описание..." value="{{.search_query}}">
            </div>
            
            <div class="filter-group">
                <label for="sort">Сортировать по:</label>
                <select id="sort" name="sort_by">
                    <option value="">Без сортировки</option>
                    <option value="id" {{if eq .sort_by "id"}}selected{{end}}>ID</option>
                    <option value="name" {{if eq .sort_by "name"}}selected{{end}}>Названию</option>
                    <option value="price" {{if eq .sort_by "price"}}selected{{end}}>Цене</option>
                    <option value="sku" {{if eq .sort_by "sku"}}selected{{end}}>Артикулу</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="direction">Направление:</label>
                <select id="direction" name="direction">
                    <option value="asc" {{if eq .direction "asc"}}selected{{end}}>По возрастанию</option>
                    <option value="desc" {{if eq .direction "desc"}}selected{{end}}>По убыванию</option>
                </select>
            </div>
        </div>
        
        <div class="filter-buttons">
            <button type="submit" class="btn btn-primary btn-hover-lift" id="applyBtn">
                Применить фильтры
            </button>
            <a href="/shop" class="btn btn-gray btn-hover-lift" id="resetBtn">
                Сбросить фильтры
            </a>
        </div>
    </form>

    <!-- ТАБЛИЦА -->
    <table id="table">
        <thead>
        <tr>
            <th onclick="sortTable(0)">ID</th>
            <th onclick="sortTable(1)">Название</th>
            <th onclick="sortTable(2)">Цена</th>
            <th>Описание</th>
            <th>Артикул</th>
            <th>Действия</th>
        </tr>
        </thead>

        <tbody>
        {{range .products}}
        <tr>
            <td>{{.ID}}</td>
            <td>{{.Name}}</td>
            <td class="price">{{printf "%.2f" .Price}}</td>
            <td>{{.Description}}</td>
            <td>{{.SKU}}</td>

            <td>
                {{if eq $.role "customer"}}
                    <!-- ИЗМЕНЕНО: Теперь это кнопка, которая вызывает JS функцию без перезагрузки -->
                    <button class="btn btn-buy" onclick="addToCart(event, '{{.ID}}', '{{.Name}}')">
                        Купить
                    </button>
                {{end}}

                {{if eq $.role "admin"}}
                    <a class="btn btn-edit" href="/products/{{.ID}}/edit">Редакт</a>
                    <a class="btn btn-delete"
                       href="/products/{{.ID}}/delete"
                       onclick="return confirm('Удалить товар?')">
                        Удалить
                    </a>
                {{end}}
            </td>
        </tr>
        {{end}}
        </tbody>
    </table>

</div>

<script>
// Функция сортировки таблицы (осталась без изменений)
function sortTable(n) {
    let table = document.getElementById("table");
    let switching = true;
    let dir = "asc";

    while (switching) {
        switching = false;
        let rows = table.rows;

        for (let i = 1; i < rows.length - 1; i++) {
            let shouldSwitch = false;

            let x = rows[i].getElementsByTagName("TD")[n].innerText;
            let y = rows[i + 1].getElementsByTagName("TD")[n].innerText;

            if (n === 0 || n === 2) {
                x = parseFloat(x);
                y = parseFloat(y);
            }

            if (dir === "asc" ? x > y : x < y) {
                shouldSwitch = true;
                break;
            }
        }

        if (shouldSwitch) {
            rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
            switching = true;
        } else if (dir === "asc") {
            dir = "desc";
            switching = true;
        }
    }
}

// НОВАЯ ФУНКЦИЯ: Добавление в корзину без перезагрузки страницы
function addToCart(event, productId, productName) {
    // 1. Блокируем стандартное поведение (если вдруг кнопка находится в форме)
    event.preventDefault(); 

    // 2. Отправляем фоновый GET-запрос на твой роут добавления в корзину
    fetch('/cart/add/' + productId, {
        method: 'GET'
    })
    .then(response => {
        // Если сервер ответил успешно (или сделал свой редирект внутри)
        if (response.ok || response.redirected) {
            alert("Товар '" + productName + "' успешно добавлен в корзину!");
        } else {
            alert("Не удалось добавить товар в корзину. Ошибка на сервере.");
        }
    })
    .catch(error => {
        console.error('Ошибка:', error);
        alert("Произошла ошибка сети.");
    });
}
</script>

</body>
</html>
